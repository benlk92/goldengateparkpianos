<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Lock Code · Golden Gate Park Pianos</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f6c624">
  <link rel="icon" href="../img/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="code">

  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="../">
        <img class="brand-mark" src="../img/icon.svg" alt="">
        Golden Gate Park Pianos
      </a>
      <a class="header-link" href="../">← Status</a>
    </div>
  </header>

  <main>
    <section class="wrap narrow code-hero">
      <h1>Your code</h1>
      <div class="dials" id="dials" role="img"></div>
      <p class="lede">Lock it up when you're done.</p>
      <div class="code-note">
        <span aria-hidden="true">🌧️</span>
        <span>Lock has <strong>numbers</strong>? The piano's closed. Please leave it.</span>
      </div>
    </section>

    <section class="section">
      <div class="wrap narrow thanks">
        <img src="../img/thanks.jpg" alt="Benjamin" loading="lazy">
        <div>
          <p>Hi, I'm Benjamin. The park doesn't run these pianos. It's just me and a few volunteers keeping them playable. Thanks for helping!</p>
          <a class="btn btn-green" data-whatsapp href="#">Join the WhatsApp</a>
        </div>
      </div>
    </section>
  </main>

  <script src="../js/config.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
